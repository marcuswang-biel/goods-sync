name: release-please

on:
  push:
    branches:
      - main

# Empty by default; each job grants only what it needs. The deploy jobs
# authenticate to Convex/Vercel/EAS with their own secrets and never need
# GITHUB_TOKEN at all.
permissions: {}

# Serializes whole runs, never cancels one. Per-job groups were not enough: they
# left build-web unserialized, so an older run could finish its build after a
# newer run deployed and then overwrite production with staler bits.
concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  # No CI job here, which is what release-please's own examples do: the workflow
  # only decides what to release and gates the deploys on `*_release_created`.
  # It can skip re-testing because `.github/rulesets/main.json` sets
  # `strict_required_status_checks_policy` — a pull request cannot merge unless
  # its head is up to date with `main`, so the squash result is the tree CI
  # already tested. That flag is load-bearing: turning it off silently means
  # deploying a commit nobody ran.
  release_please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tags and GitHub Releases
      pull-requests: write # create and update the release PR
    outputs:
      backend_release_created: ${{ steps.release.outputs['packages/backend--release_created'] }}
      backend_version: ${{ steps.release.outputs['packages/backend--version'] }}
      web_release_created: ${{ steps.release.outputs['apps/web--release_created'] }}
      web_version: ${{ steps.release.outputs['apps/web--version'] }}
      native_release_created: ${{ steps.release.outputs['apps/native--release_created'] }}
      native_version: ${{ steps.release.outputs['apps/native--version'] }}
    steps:
      # App-authored release PRs trigger CI; a GITHUB_TOKEN-authored one does
      # not. Falls back to GITHUB_TOKEN when APP_CLIENT_ID is unset.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: vars.APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write # tags and GitHub Releases
          permission-pull-requests: write # create and update the release PR

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A merged release PR that releases nothing is this pipeline's worst failure mode: every
      # deploy job is skipped by its own `if:`, the run reports success, and the only symptom is
      # a tag that never appears. release-please recognises its own merged PR by parsing the PR
      # body, so a bot that rewrites that body strands production on the old version.
      #
      # Guards the class, not one cause: a permissions change, a manifest drift or a
      # release-please regression all land here the same way.
      #
      # `releases_created` is the action's own aggregate over every configured package
      # (`setOutput('releases_created', releases.length > 0)` in its src/index.ts at the pinned
      # SHA), so adding a package cannot leave this checking a stale list. `success()` is
      # explicit because a custom `if:` changes when the implicit status check applies, and a
      # release-please step that failed outright is already loud without this one piling on.
      #
      # Two trigger signals. The subject is what release-please writes by default and no
      # `pull-request-title-pattern` is configured; the manifest catches a
      # release whose subject stopped matching, which is the one way this guard could go quiet
      # for the same reason it exists. The manifest signal also fires on a hand edit or a revert
      # of a release commit — deliberately, since those are worth a human look — so the message
      # says which signal tripped and what each one means.
      - name: Fail if a release commit shipped nothing
        if: |
          success() &&
          (startsWith(github.event.head_commit.message, 'chore: release') ||
           contains(github.event.head_commit.modified, '.release-please-manifest.json')) &&
          steps.release.outputs.releases_created != 'true'
        env:
          # Which signal fired decides what the operator should go look at.
          # Quoted: the `: ` inside the literal would otherwise read as a nested mapping.
          BY_SUBJECT: "${{ startsWith(github.event.head_commit.message, 'chore: release') }}"
        run: |
          if [ "$BY_SUBJECT" = "true" ]; then
            echo "::error::A 'chore: release' commit landed on main but release-please created no release, so every deploy job is skipped and production will not move. Most likely the release PR body was overwritten and could no longer be parsed; check this run's release-please output for 'could not parse pull request body as a release PR'. Recovery: restore the merged PR's body to release-please's format and re-run this workflow."
          else
            echo "::error::This commit changed .release-please-manifest.json but release-please created no release. If it was a hand edit or a revert of a release commit, that is expected and this run is asking you to confirm it was deliberate. If it was a release PR merge, its subject no longer starts with 'chore: release' and this step's subject check needs updating."
          fi
          exit 1

  # Builds the production frontend bundle and hands it to deploy-web as an
  # artifact. Deliberately ahead of deploy-convex: a frontend that fails to
  # build must not leave an already-deployed backend with no matching frontend.
  # Building here also means the bits that deploy are the bits that were built
  # once, rather than a second build nobody looked at.
  build-web:
    needs: release_please
    if: needs.release_please.outputs.web_release_created == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read # checkout only; the build authenticates with its own secrets
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Single source of truth for the prod Convex URL: derive it from
      # CONVEX_DEPLOY_KEY (format "prod:<deployment-name>|<token>") so it
      # can never diverge from the deployment deploy-convex shipped to.
      - name: Derive Convex prod URL from deploy key
        id: convex_url
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          name=$(printf '%s' "$CONVEX_DEPLOY_KEY" | sed 's|^prod:||;s|\|.*||')
          if [ -z "$name" ]; then
            echo "::error::Could not derive Convex deployment name from CONVEX_DEPLOY_KEY"
            exit 1
          fi
          url="https://${name}.convex.cloud"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "site_url=https://${name}.convex.site" >> "$GITHUB_OUTPUT"
          echo "Convex prod URL: $url"

      # Pinned on purpose: an unpinned vercel@latest means every prod
      # deploy pulls whatever CLI shipped that day — non-reproducible and
      # an unnecessary supply-chain surface on the release path.
      - name: Install Vercel CLI
        run: npm install --global vercel@54.0.0

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # vercel build does not forward the runner's shell env into the
      # framework build ("Build not running on Vercel. System environment
      # variables will not be available."), so step-level env on the build
      # step never reaches Vite. Write build-time vars into dotenv files
      # Vite actually loads instead.
      - name: Inject web build env
        env:
          VITE_CONVEX_URL: ${{ steps.convex_url.outputs.url }}
          VITE_CONVEX_SITE_URL: ${{ steps.convex_url.outputs.site_url }}
        run: |
          for f in .vercel/.env.production.local apps/web/.env.production.local; do
            printf 'VITE_CONVEX_URL=%s\n' "$VITE_CONVEX_URL" >> "$f"
            printf 'VITE_CONVEX_SITE_URL=%s\n' "$VITE_CONVEX_SITE_URL" >> "$f"
          done

      - name: Build Vercel output
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Tar rather than a raw directory upload: the artifact ZIP transport
      # normalizes permissions to 0644/0755 and dereferences symlinks. Today's
      # output is a static SPA that survives both, but a future Vercel function
      # bundle would not. Tar also fails outright when output is missing, so
      # build-web cannot report success with nothing to deploy.
      #
      # Only .vercel/output — never the sibling .vercel/.env.production.local,
      # which holds raw secrets. The bundle carries the VITE_* values Vite
      # inlined, but those are client-side values the site serves publicly.
      - name: Pack prebuilt output
        run: tar -cf "$RUNNER_TEMP/vercel-output.tar" -C .vercel output

      - name: Upload prebuilt output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-output
          path: ${{ runner.temp }}/vercel-output.tar
          if-no-files-found: error
          retention-days: 1

  # Backend (Convex) deploy. Runs when release-please cut a packages/backend
  # release. Web-only/native-only releases do not drag the backend through a
  # redeploy + migration run.
  #
  # Ordering invariant: backend changes must stay backward compatible
  # (expand/contract). deploy-web is gated to run AFTER this job, but a
  # web release can legitimately lag one version behind backend, so the
  # just-deployed backend must still serve the older frontend.
  #
  # build-web guard: `!= failure/cancelled` rather than `== success`, because a
  # backend-only release skips build-web entirely and must still deploy.
  deploy-convex:
    name: deploy-convex
    needs: [release_please, build-web]
    if: |
      always() &&
      needs.release_please.result == 'success' &&
      needs.release_please.outputs.backend_release_created == 'true' &&
      needs.build-web.result != 'failure' &&
      needs.build-web.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read # checkout only; deploys authenticate with their own secrets
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Deploy Convex functions
        run: pnpm -C packages/backend exec convex deploy

      - name: Run Convex migrations
        run: pnpm -C packages/backend exec convex run migrations:runAll

  # Ships the artifact build-web produced. No checkout, no pnpm install, no
  # rebuild — `vercel deploy --prebuilt` only uploads .vercel/output, so the
  # deployed bits are exactly the ones that were built.
  #   - web-only release      -> deploy-convex skipped, web still deploys
  #   - backend + web release -> web waits for deploy-convex success
  #   - deploy-convex failed  -> web does NOT deploy (never ship a
  #                              frontend ahead of a broken backend)
  deploy-web:
    name: deploy-web
    needs: [release_please, build-web, deploy-convex]
    if: |
      always() &&
      needs.build-web.result == 'success' &&
      needs.deploy-convex.result != 'failure' &&
      needs.deploy-convex.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read # the CLI resolves the project root directory on disk
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Checkout but no pnpm install: --prebuilt uploads .vercel/output and
      # needs no node_modules, but the CLI still resolves the project's Root
      # Directory (apps/web, per apps/web/vercel.json) against the filesystem.
      # No `vercel pull` either — VERCEL_ORG_ID/VERCEL_PROJECT_ID are enough to
      # link, and pull only matters for `vercel build`/`vercel dev`.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Pinned explicitly: without the setup action the CLI would run on
      # whatever Node ubuntu-latest happens to ship.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@54.0.0

      - name: Download prebuilt output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vercel-output
          path: ${{ runner.temp }}

      - name: Restore prebuilt output
        run: |
          mkdir -p .vercel
          tar -xf "$RUNNER_TEMP/vercel-output.tar" -C .vercel

      # --archive=tgz is the official Vercel workaround for the files
      # upload limit on a large pnpm-monorepo .vercel/output.
      - name: Deploy prebuilt Vercel output
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}

  # Native (EAS) release. Runs when release-please cuts an apps/native release.
  # It compares the current release against the previous native release tag:
  #   - Expo fingerprint changes -> build Android + iOS
  #   - unchanged fingerprint    -> publish EAS Update
  #
  # Waits on deploy-convex for the same reason deploy-web does: native clients
  # must not ship ahead of a failed backend deploy.
  deploy-native:
    name: deploy-native
    needs: [release_please, build-web, deploy-convex]
    if: |
      always() &&
      needs.release_please.result == 'success' &&
      needs.release_please.outputs.native_release_created == 'true' &&
      needs.build-web.result != 'failure' &&
      needs.build-web.result != 'cancelled' &&
      needs.deploy-convex.result != 'failure' &&
      needs.deploy-convex.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read # checkout only; deploys authenticate with their own secrets
    env:
      APP_VARIANT: production
      EXPO_NO_DOTENV: '1'
    steps:
      # Keeps the checkout credentials on purpose, unlike every other job here:
      # the fingerprint step below runs `git fetch --force --tags` and clones a
      # previous tag into a worktree, which needs auth against a private repo.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Setup EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve native release plan
        id: native_plan
        shell: bash
        env:
          NATIVE_VERSION: ${{ needs.release_please.outputs.native_version }}
        run: |
          head_ref="HEAD"
          release_label="native v${NATIVE_VERSION}"

          git fetch --force --tags

          previous_tag="$(
            for tag in $(git tag --list "native-v*"); do
              if git merge-base --is-ancestor "$tag" "${head_ref}^" 2>/dev/null; then
                printf '%s %s\n' "$(git log -1 --format=%ct "$tag")" "$tag"
              fi
            done | sort -nr | awk 'NR == 1 { print $2 }'
          )"

          run_build=false
          publish_update=false
          native_changed=false
          fingerprint_changed=false
          previous_fingerprint_hash=""
          current_fingerprint_hash=""
          reason=""
          repo_root="$(pwd)"
          fingerprint_bin="$repo_root/node_modules/.bin/fingerprint"

          # Fingerprint hashes native sources from node_modules (via expo
          # autolinking), so the previous ref needs its own install in an
          # isolated worktree — reusing HEAD's node_modules would hash the
          # same dependency versions for both refs and mask native bumps.
          prev_worktree="${RUNNER_TEMP:-/tmp}/fingerprint-prev-worktree"

          prepare_previous_worktree() {
            git worktree add --detach --quiet "$prev_worktree" "$previous_tag" &&
              (cd "$prev_worktree" && pnpm install --frozen-lockfile)
          }

          generate_previous_fingerprint() {
            local output_file="$1"

            # Each ref uses its own fingerprint bin: invoking one install's
            # bin against the other tree changes the hash (loaded-module
            # paths are part of the fingerprint). Known consequence: a
            # release that bumps @expo/fingerprint itself compares hashes
            # from two tool versions and conservatively builds natives once.
            "$prev_worktree/node_modules/.bin/fingerprint" fingerprint:generate "$prev_worktree/apps/native" > "$output_file"
          }

          generate_current_fingerprint() {
            local output_file="$1"

            "$fingerprint_bin" fingerprint:generate "$repo_root/apps/native" > "$output_file"
          }

          read_fingerprint_hash() {
            node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.stdout.write(data.hash ?? "");
            ' "$1"
          }

          if [[ -z "$previous_tag" ]]; then
            run_build=true
            native_changed=true
            fingerprint_changed=true
            reason="First native release; building native apps."
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$head_ref" || true)"
          else
            changed_files="$(git diff --name-only "$previous_tag" "$head_ref" || true)"

            previous_fingerprint_file="$(mktemp)"
            current_fingerprint_file="$(mktemp)"
            trap 'git worktree remove --force "$prev_worktree" 2>/dev/null || true' EXIT

            if ! generate_current_fingerprint "$current_fingerprint_file"; then
              native_changed=true
              fingerprint_changed=true
              reason="Unable to generate current Expo fingerprint; building native apps."
            elif ! prepare_previous_worktree; then
              native_changed=true
              fingerprint_changed=true
              reason="Unable to install previous release dependencies for fingerprinting; building native apps."
            elif ! generate_previous_fingerprint "$previous_fingerprint_file"; then
              native_changed=true
              fingerprint_changed=true
              reason="Unable to generate previous Expo fingerprint; building native apps."
            elif previous_fingerprint_hash="$(read_fingerprint_hash "$previous_fingerprint_file")" &&
              current_fingerprint_hash="$(read_fingerprint_hash "$current_fingerprint_file")"; then
              if [[ -z "$previous_fingerprint_hash" || -z "$current_fingerprint_hash" ]]; then
                native_changed=true
                fingerprint_changed=true
                reason="Unable to read Expo fingerprint hash; building native apps."
              elif [[ "$previous_fingerprint_hash" != "$current_fingerprint_hash" ]]; then
                native_changed=true
                fingerprint_changed=true
              fi
            else
              native_changed=true
              fingerprint_changed=true
              reason="Unable to read Expo fingerprint output; building native apps."
            fi

            if [[ "$native_changed" == "true" ]]; then
              run_build=true
              if [[ -z "$reason" ]]; then
                reason="Expo fingerprint changed; building native apps."
              fi
            else
              publish_update=true
              reason="Release has no Expo fingerprint change; publishing EAS Update."
            fi
          fi

          {
            echo "previous_tag=$previous_tag"
            echo "release_label=$release_label"
            echo "run_build=$run_build"
            echo "publish_update=$publish_update"
            echo "native_changed=$native_changed"
            echo "fingerprint_changed=$fingerprint_changed"
            echo "previous_fingerprint_hash=$previous_fingerprint_hash"
            echo "current_fingerprint_hash=$current_fingerprint_hash"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Native release plan"
            echo ""
            echo "- Previous tag: \`${previous_tag:-none}\`"
            echo "- Release: \`${release_label:-unknown}\`"
            echo "- Build native apps: \`$run_build\`"
            echo "- Publish EAS Update: \`$publish_update\`"
            echo "- Fingerprint changed: \`$fingerprint_changed\`"
            echo "- Previous fingerprint: \`${previous_fingerprint_hash:-unknown}\`"
            echo "- Current fingerprint: \`${current_fingerprint_hash:-unknown}\`"
            echo "- Reason: $reason"
            echo ""
            echo "<details><summary>Changed files</summary>"
            echo ""
            echo '```'
            printf '%s\n' "$changed_files"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip native release
        if: steps.native_plan.outputs.run_build != 'true' && steps.native_plan.outputs.publish_update != 'true'
        run: echo "${{ steps.native_plan.outputs.reason }}"

      - name: Check production EAS token
        if: steps.native_plan.outputs.run_build == 'true' || steps.native_plan.outputs.publish_update == 'true'
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "Missing required GitHub secret: EXPO_TOKEN"
            exit 1
          fi

      - name: Validate native workspace
        if: steps.native_plan.outputs.run_build == 'true' || steps.native_plan.outputs.publish_update == 'true'
        run: pnpm --filter @acme/native run check

      - name: Build Android APK
        if: steps.native_plan.outputs.run_build == 'true'
        working-directory: apps/native
        run: eas build --profile production --platform android --non-interactive --no-wait

      - name: Build and submit iOS app
        if: steps.native_plan.outputs.run_build == 'true'
        working-directory: apps/native
        run: eas build --profile production --platform ios --non-interactive --auto-submit --no-wait

      - name: Publish EAS Update
        if: steps.native_plan.outputs.publish_update == 'true'
        working-directory: apps/native
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          eas update \
            --channel production \
            --environment production \
            --platform all \
            --message "${{ steps.native_plan.outputs.release_label }} ${GITHUB_SHA:0:7}" \
            --non-interactive
